[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "day-03-validator"
version = "0.1.0"
description = "Day 03 task: CSV purchase order validator using Pydantic"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/validator"]